<section class="smart-form-shell">
  @if (isLoadingInscricao()) {
    <p class="loading-message">Carregando inscricao...</p>
  }

  @if (submitError()) {
    <div class="error-banner" role="alert">{{ submitError() }}</div>
  }

  @if (cepError()) {
    <div class="warning-banner" role="status">{{ cepError() }}</div>
  }

  <app-form-edit
    [parentForm]="form"
    [modo]="modo()"
    [readonlyMode]="modo() === 'view'"
    [isSubmitting]="isSubmitting()"
    (submitClicked)="submit()"
    (clearClicked)="clearForm()"
  />
</section>
